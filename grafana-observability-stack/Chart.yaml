apiVersion: v2
name: grafana-observability-stack
description: A Helm umbrella chart for the Grafana observability stack
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
- name: grafana
  version: "8.3.3"
  repository: "https://grafana.github.io/helm-charts"
  alias: grafana
- name: loki
  version: "6.5.2"
  repository: "https://grafana.github.io/helm-charts"
  alias: loki
- name: tempo-distributed
  version: "1.14.0"
  repository: "https://grafana.github.io/helm-charts"
  alias: tempo
- name: pyroscope
  version: "1.3.0"
  repository: "https://grafana.github.io/helm-charts"
  alias: pyroscope
- name: alloy
  version: "1.0.0"
  repository: "https://grafana.github.io/helm-charts"
  alias: alloy
- name: kube-prometheus-stack
  version: "58.2.0"
  repository: "https://prometheus-community.github.io/helm-charts"
  alias: prometheus
